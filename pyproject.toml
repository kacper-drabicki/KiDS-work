[project]
name = "kids-work"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "astropy>=8.0.1",
    "bayesian-torch>=0.5.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "polars>=2.0.0",
    "scikit-learn>=1.9.1",
    "torch>=2.14.1",
    "torchsom>=1.3.1",
    "xgboost>=3.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kids"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
